<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="ai-generated" content="true">
    <title>LLM Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p id="ai-disclosure">You're talking to an AI system. Answers are machine-generated and may be wrong.</p>
    <p id="gdpr-disclosure">No account, chat history, or IP address is kept -- see <a href="https://github.com/otzpt/LLMwebsite/blob/main/COMPLIANCE.md">COMPLIANCE.md</a>.</p>
    <div id="chat-container">
        <div id="messages"></div>
        <form id="chat-form">
            <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off" required />
            <button type="submit">Send</button>
        </form>
    </div>
    <script src="main.js"></script>
</body>
</html>
